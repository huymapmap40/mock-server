# Health check API — public (no auth).
# Demonstrates multiple response cases for one endpoint, selected by a query
# parameter, with priority controlling which matches first. The success case
# also shows the CSV "envelope" shape: rows nested under a key (`dependencies`)
# of an otherwise-static JSON object.
service: health

expectations:
  # 5xx — internal server error
  - description: Internal server error scenario
    priority: 20
    request:
      method: GET
      path: /health
      query:
        scenario: server-error
    response:
      status: 500
      json:
        status: DOWN
        error: Internal Server Error
        code: 500
        message: The service encountered an unexpected internal condition.

  # 4xx — client error
  - description: Client error scenario
    priority: 20
    request:
      method: GET
      path: /health
      query:
        scenario: client-error
    response:
      status: 400
      json:
        status: ERROR
        error: Bad Request
        code: 400
        message: The health check request was invalid.

  # 200 — success (default / catch-all). The per-dependency rows come from
  # health.csv and are placed under `dependencies` (dataKey) on the json object.
  - description: Success (default)
    priority: 10
    request:
      method: GET
      path: /health
    response:
      status: 200
      dataFile: health.csv
      dataKey: dependencies
      json:
        status: UP
        service: mock-external-service
